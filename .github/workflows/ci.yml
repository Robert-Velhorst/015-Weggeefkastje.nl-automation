name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: '3.15.1'
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run lint:install
      - run: npm --prefix tools/lint audit --audit-level=low
      - run: npm run build:sqlite -- --require-upgrade-baseline
      - name: Record actual runtime and SQLite
        run: |
          mkdir -p output
          node scripts/verify-stable-runtime.mjs > output/stable-runtime-verification.json
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:production
      - run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet
        env:
          PRODUCTION_ENV_FILE: .env.production.example
      - run: docker build -t weggeefkastje-automation:test .
      - name: Validate production reverse-proxy configuration
        run: docker run --rm -e APP_DOMAIN=ci.example.nl -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - name: Compiled container bootstrap, worker, backup and readiness
        run: |
          docker volume create weggeef-test
          printf '%s' '{"email":"ci@example.nl","password":"synthetic-ci-password-only","displayName":"CI Owner","workspaceName":"CI Pilot"}' | docker run --rm -i -v weggeef-test:/app/data -e APP_BASE_URL=https://ci.example.nl weggeefkastje-automation:test node dist/cli.js bootstrap
          docker run --rm -v weggeef-test:/app/data -e APP_BASE_URL=https://ci.example.nl weggeefkastje-automation:test node dist/worker.js --once
          docker run --rm -v weggeef-test:/app/data -e APP_BASE_URL=https://ci.example.nl weggeefkastje-automation:test node dist/backup-worker.js --once
          docker run -d --name weggeef-ci -v weggeef-test:/app/data -e APP_BASE_URL=https://ci.example.nl weggeefkastje-automation:test
          for attempt in $(seq 1 30); do
            if docker exec weggeef-ci node dist/healthcheck.js server; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify the actual production container runtime
        run: docker exec -i weggeef-ci node --input-type=module - --container < scripts/verify-stable-runtime.mjs > output/container-runtime-verification.json
      - name: Scan all installed production packages
        run: |
          docker image save weggeefkastje-automation:test --output output/image.tar
          chmod 0444 output/image.tar
          docker run --rm --read-only --tmpfs /tmp:rw,size=2048m --cap-drop ALL \
            --mount "type=bind,source=$GITHUB_WORKSPACE/output/image.tar,target=/scan/image.tar,readonly" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --cache-dir /tmp/trivy-cache --scanners vuln --skip-java-db-update --quiet --list-all-pkgs \
            --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --input /scan/image.tar > output/image-security.json
      - name: Verify complete image inventory
        run: node scripts/check-image-security.mjs
      - name: Retain synthetic runtime and installed-image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-linux-${{ matrix.node-version }}
          path: |
            output/*verification.json
            output/image-security.json
      - name: Clean up CI-owned containers
        if: always()
        run: |
          docker rm -f weggeef-ci || true
          docker volume rm weggeef-test || true

  windows-source:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: '3.15.1'
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run lint:install
      - run: npm --prefix tools/lint audit --audit-level=low
      - run: npm run build:sqlite -- --require-upgrade-baseline
      - name: Record actual Windows runtime
        shell: bash
        run: |
          mkdir -p output
          node scripts/verify-stable-runtime.mjs > output/stable-runtime-verification.json
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:production
      - name: Retain actual Windows SQLite build and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-windows
          path: output/*verification.json

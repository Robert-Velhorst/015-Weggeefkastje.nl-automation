name: weggeefkastje-production

x-runtime: &runtime
  image: weggeefkastje:${APP_VERSION:?Set an immutable APP_VERSION release tag}
  env_file: ${PRODUCTION_ENV_FILE:-.env.production}
  environment: &environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    APP_DATA_DIR: /app/data
    DATABASE_PATH: /app/data/weggeefkastjes.sqlite
    WEB_DIST_PATH: /app/dist-web
    APP_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN to your public hostname}
    TRUST_PROXY: 'true'
    COOKIE_SECURE: 'true'
    ALLOW_NETWORK_BINDING: 'true'
    ALLOW_REMOTE_SETUP: 'false'
    ENABLE_DEMO_MODE: 'false'
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m,mode=1777]
  volumes: [app-data:/app/data]
  networks: [application]
  stop_grace_period: 40s
  cpus: 1.0
  mem_limit: 512m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  app:
    <<: *runtime
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    healthcheck:
      test: [CMD, node, dist/healthcheck.js, server]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  worker:
    <<: *runtime
    command: [node, dist/worker.js]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/healthcheck.js, worker]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  backup:
    <<: *runtime
    command: [node, dist/backup-worker.js]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/healthcheck.js, backup]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
  proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [application]
    depends_on: [app]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  app-data:
  caddy-data:
  caddy-config:
networks:
  application:

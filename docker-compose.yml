services:
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # This compose file is intentionally a loopback-only local deployment.
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      DATABASE_PATH: /app/data/weggeefkastjes.sqlite
      WEB_DIST_PATH: /app/dist-web
      ALLOW_NETWORK_BINDING: "true"
      COOKIE_SECURE: "false"
    healthcheck:
      # Local installation must remain reachable before the first admin is created.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    volumes:
      - weggeefkastje_data:/app/data
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: [CMD, node, dist/healthcheck.js, worker]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      HOST: 127.0.0.1
      APP_DATA_DIR: /app/data
      DATABASE_PATH: /app/data/weggeefkastjes.sqlite
      WEB_DIST_PATH: /app/dist-web
    volumes:
      - weggeefkastje_data:/app/data
    depends_on:
      app:
        condition: service_healthy
volumes:
  weggeefkastje_data:
